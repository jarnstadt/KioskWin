name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore KioskWin.sln

      - name: Run tests
        run: dotnet test KioskWin.sln -c Release --no-restore --nologo

      - name: Publish win-x64
        run: >-
          dotnet publish src/KioskWin/KioskWin.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package publish output
        run: Compress-Archive -Path publish\* -DestinationPath KioskWin-win-x64.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KioskWin-win-x64
          path: |
            publish/
            KioskWin-win-x64.zip
          if-no-files-found: error
          retention-days: 14
